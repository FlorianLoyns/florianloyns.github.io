<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Seite nicht gefunden – Florian Loyns</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#127878" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23127878%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2246%22%20font-family%3D%22system-ui%22%20font-size%3D%2236%22%20font-weight%3D%22900%22%20fill%3D%22white%22%20text-anchor%3D%22middle%22%3Efl%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Läuft vor dem ersten Rendern: kein kurzes Aufblitzen des falschen Farbschemas -->
  <script>
  (function() {
    try {
      var stored = localStorage.getItem('fl-theme');
      if (stored === 'dark' || stored === 'light') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) {}
  })();
  </script>

  <style>
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/inter-latin-wght-normal.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                     U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                     U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      --teal: #127878;
      --teal-dark: #0e5f5f;
      --teal-soft: #e6f3f3;
      --marine: #2c4a6e;
      --marine-dark: #1e3452;
      --marine-soft: #eef2f7;
      --ink: #111827;
      --body: #374151;
      --muted: #6b7280;
      --bg: #fbfbfc;
      --surface: #ffffff;
      --border: #e5e7eb;
      --star: var(--teal);
      --on-accent: #ffffff;
      color-scheme: light;
    }
    /* Dunkle Palette an genau einer Stelle gepflegt: einmal für die
       Systemeinstellung, einmal für die manuelle Wahl über den Schalter. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
      --teal: #2dd4bf; --teal-dark: #14b8a6; --teal-soft: rgba(45,212,191,.12);
      --marine: #7dd3fc; --marine-dark: #38bdf8; --marine-soft: rgba(125,211,252,.1);
      --ink: #f1f5f9; --body: #cbd5e1; --muted: #94a3b8;
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --star: var(--teal);
      --on-accent: #0f172a;
      color-scheme: dark;
      }
    }
    [data-theme="dark"] {
      --teal: #2dd4bf; --teal-dark: #14b8a6; --teal-soft: rgba(45,212,191,.12);
      --marine: #7dd3fc; --marine-dark: #38bdf8; --marine-soft: rgba(125,211,252,.1);
      --ink: #f1f5f9; --body: #cbd5e1; --muted: #94a3b8;
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --star: var(--teal);
      --on-accent: #0f172a;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--body);
      line-height: 1.6;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    a { color: inherit; }

    .skip-link {
      position: absolute;
      left: 12px;
      top: -60px;
      background: var(--ink);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      z-index: 100;
      transition: top .15s ease;
    }
    .skip-link:focus { top: 12px; outline: 2px solid var(--teal); }

    :focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 3px;
      border-radius: 4px;
    }
    .card:focus-visible { outline-offset: 4px; }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }

    /* ========== Hero ========== */
    .hero {
      padding: 80px 0 56px;
      padding-top: max(80px, env(safe-area-inset-top) + 64px);
      border-bottom: 1px solid var(--border);
    }
    .hero .eyebrow {
      color: var(--teal);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin: 0 0 24px;
    }
    .hero h1 {
      margin: 0 0 20px;
      color: var(--ink);
      font-size: clamp(36px, 5vw, 60px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .hero .lead {
      max-width: 720px;
      margin: 0 0 32px;
      font-size: clamp(18px, 2vw, 20px);
      color: var(--body);
    }
    .hero .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 22px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease, gap .15s ease;
      border: 1px solid transparent;
    }
    .btn-primary { background: var(--teal); color: var(--on-accent); }
    .btn-primary:hover { background: var(--teal-dark); gap: 12px; }
    .btn-secondary {
      background: transparent;
      color: var(--marine);
      border-color: var(--marine);
    }
    .btn-secondary:hover { background: var(--marine); color: var(--on-accent); gap: 12px; }

    .hero .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 40px;
      margin: 40px 0 0;
      padding-top: 26px;
      border-top: 1px solid var(--border);
    }
    .hero .stats > div { margin: 0; }
    .hero .stats dt {
      font-size: 28px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .hero .stats dd {
      margin: 0;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
    }

    /* ========== About ========== */
    .about { padding: 48px 0 16px; }
    .about p {
      max-width: 720px;
      font-size: 18px;
      color: var(--body);
      margin: 0 0 14px;
    }
    .about p strong { color: var(--ink); }
    .about p a { color: var(--teal-dark); font-weight: 600; }
    [data-theme="dark"] .about p a { color: var(--teal); }
    .about-sig {
      margin-top: 22px;
      font-weight: 800;
      color: var(--ink);
      font-size: 17px;
    }
    .about-sig span { font-weight: 500; color: var(--muted); font-size: 15px; }

    /* ========== Sections ========== */
    section.block { padding: 56px 0 40px; }
    section.block h2 {
      margin: 0 0 6px;
      font-size: clamp(26px, 3vw, 32px);
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    section.block .section-lead {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 17px;
    }
    section.block h2::before {
      content: "";
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-right: 14px;
      vertical-align: 3px;
    }
    section.block.teal h2::before   { background: var(--teal); }
    section.block.marine h2::before { background: var(--marine); }

    /* ========== Card Grid ========== */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 28px 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
    }
    .card.teal::before   { background: var(--teal); }
    .card.marine::before { background: var(--marine); }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -20px rgba(15, 23, 42, .25);
    }
    /* Info-Karten sind keine Links – kein Hover-Versprechen, kein Zeigefinger */
    .card[data-info] { cursor: default; }
    .card[data-info]:hover { transform: none; box-shadow: none; border-color: var(--border); }
    .card.teal:hover   { border-color: var(--teal); }
    .card.marine:hover { border-color: var(--marine); }

    .card .tag {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin: 4px 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .card.teal .tag   { color: var(--teal); }
    .card.marine .tag { color: var(--marine); }

    /* App-icon top-right on featured cards */
    .card-logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, .12);
    }
    .card.has-logo .tag,
    .card.has-logo h3,
    .card.has-logo > p {
      padding-right: 72px;
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .card p {
      margin: 0 0 20px;
      color: var(--body);
      font-size: 15.5px;
      line-height: 1.55;
    }
    .card .features {
      list-style: none;
      margin: 0 0 20px;
      padding: 0;
      font-size: 14px;
      color: var(--muted);
    }
    .card .features li {
      padding: 3px 0 3px 22px;
      position: relative;
    }
    .card .features li::before {
      content: "✓";
      position: absolute;
      left: 0;
      top: 3px;
      font-weight: 700;
    }
    /* Alternativtext leert den Haken fuer Screenreader; Browser ohne
       Unterstuetzung ignorieren nur die zweite Regel. */
    @supports (content: "a" / "") {
      .card .features li::before { content: "✓" / ""; }
    }
    .card.teal   .features li::before { color: var(--teal); }
    .card.marine .features li::before { color: var(--marine); }

    .card .steps {
      margin: 0 0 4px;
      padding-left: 24px;
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--body);
    }
    .card .steps li { padding: 2px 0; }
    .card .steps li::marker { color: var(--teal); font-weight: 700; }

    .card .cta {
      margin-top: auto;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .card.teal .cta   { color: var(--teal-dark); }
    .card.marine .cta { color: var(--marine-dark); }
    .card:hover .cta  { gap: 10px; }
    .card-actions { margin-top: auto; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .card-actions a { font-size: 15px; font-weight: 600; color: var(--marine-dark); text-decoration: none; }
    .card-actions a:hover { text-decoration: underline; }

    /* ===== GitHub-Sterne (statisch aus stars.json, kein externer Abruf) ===== */
    .cta-row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .cta-row .cta { margin-top: 0; }
    .stars-inline {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
    }
    .stars-inline svg { width: 13px; height: 13px; color: var(--star); }
    .card.marine .stars-inline svg { color: var(--marine); }
    .card-actions .stars-inline { margin-left: auto; }
    /* Blauer Stern (marine) nach oben rechts: dort ist Platz (kein Logo), und
       die Aktionszeile unten bricht am Handy nicht mehr um. Grüne (teal)
       Karten bleiben unverändert – ihr Stern sitzt weiter unten. */
    .card.marine .stars-inline {
      position: absolute;
      top: 26px;
      right: 24px;
      margin: 0;
    }
    .card.marine .tag { padding-right: 52px; }
    .version-pill {
      text-transform: none;
      background: var(--marine-soft);
      color: var(--marine-dark);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 1px;
      font-weight: 700;
    }
    [data-theme="dark"] .version-pill { color: var(--marine); }

    /* ========== Footer ========== */
    footer {
      margin-top: 32px;
      padding: 40px 0 56px;
      color: var(--muted);
      font-size: 14.5px;
    }
    footer .row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    footer a { color: var(--muted); text-decoration: none; transition: opacity .15s; }
    footer a:hover { opacity: .65; }
    footer p { margin: 6px 0; }
    footer .small { font-size: 13px; opacity: .8; }


/* ========== PWA Install Gallery ========== */
    /* PWA-Installationsgalerie */
    .pwa-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 40px;
    }
    .pwa-gallery-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .pwa-gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      border: none;
      border-radius: 0;
      outline: none;
      transition: transform .2s ease;
    }
    .pwa-gallery-item:hover img {
      transform: translateY(-4px);
    }
    /* Dark/light screenshot switching */
    .pwa-img-dark { display: none; }
    .pwa-img-light { display: block; }
    @media (prefers-color-scheme: dark) {
      .pwa-img-dark  { display: block; }
      .pwa-img-light { display: none; }
    }
    [data-theme="dark"]  .pwa-img-dark  { display: block !important; }
    [data-theme="dark"]  .pwa-img-light { display: none  !important; }
    [data-theme="light"] .pwa-img-dark  { display: none  !important; }
    [data-theme="light"] .pwa-img-light { display: block !important; }
    .pwa-step-label {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--teal);
      text-align: center;
    }
    .pwa-step-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    /* Mobile: horizontaler App-Store-Swipe */
    @media (max-width: 680px) {
      .pwa-gallery {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        gap: 14px;
        padding-bottom: 8px;
        margin-left: -16px;
        margin-right: -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .pwa-gallery::-webkit-scrollbar { display: none; }
      .pwa-gallery-item {
        flex: 0 0 72vw;
        scroll-snap-align: start;
      }
    }
    /* ========== Theme Toggle ========== */
    #btn-theme {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      display: grid; place-items: center;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
      margin-left: auto;
    }
    #btn-theme:hover { background: var(--border); }


    /* ========== Mobile-Optimierungen ========== */
    @media (max-width: 600px) {
      .container {
        padding-left: max(18px, env(safe-area-inset-left));
        padding-right: max(18px, env(safe-area-inset-right));
      }
      .hero {
        padding: 48px 0 32px;
        padding-top: max(48px, env(safe-area-inset-top) + 32px);
      }
      .hero h1 { font-size: clamp(28px, 8vw, 42px); }
      .about { padding: 32px 0 8px; }
      section.block { padding: 36px 0 28px; }
      .card { padding: 22px 20px 20px; }
      footer { padding: 28px 0 calc(28px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header class="hero" style="border-bottom:none">
    <div class="container">
      <p class="eyebrow">Fehler 404</p>
      <h1>Diese Seite gibt es nicht.</h1>
      <p class="lead">
        Vielleicht wurde ein Werkzeug umbenannt oder der Link hat sich vertippt.
        Auf der Startseite liegen alle Trainings, Rechner und Werkzeuge beieinander.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Zur Startseite &rarr;</a>
        <a href="mailto:c-8347@posteo.de" class="btn btn-secondary">Fehler melden</a>
      </div>
    </div>
  </header>
</body>
</html>
